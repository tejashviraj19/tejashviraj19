<svg width="820" height="150" viewBox="0 0 820 150" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="820" height="150" fill="#070c11"/>

  <g fill="none" stroke="#1f4a5c" stroke-width="1.5">
    <path id="flow" d="M 100 75 H 265 M 345 75 H 425 M 505 75 H 585 M 665 75 H 730"/>
  </g>

  <!-- nodes -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#dbeafe" text-anchor="middle">
    <g>
      <rect x="20" y="50" width="160" height="50" rx="7" fill="#0e1a24" stroke="#274a5c"/>
      <text x="100" y="80" font-weight="600">Sensors</text>
    </g>
    <g>
      <rect x="265" y="50" width="80" height="50" rx="7" fill="#0e1a24" stroke="#38bdf8"/>
      <text x="305" y="80" font-weight="600" fill="#7dd3fc">ESP32</text>
    </g>
    <g>
      <rect x="425" y="50" width="80" height="50" rx="7" fill="#0e1a24" stroke="#274a5c"/>
      <text x="465" y="75">Control</text>
      <text x="465" y="89">Logic</text>
    </g>
    <g>
      <rect x="585" y="50" width="80" height="50" rx="7" fill="#0e1a24" stroke="#274a5c"/>
      <text x="625" y="80">Actuators</text>
    </g>
    <g>
      <rect x="730" y="45" width="70" height="60" rx="7" fill="#0e1a24" stroke="#4ade80"/>
      <text x="765" y="72" fill="#86efac">Cloud</text>
      <text x="765" y="86" fill="#86efac">Dashboard</text>
    </g>
  </g>

  <!-- travelling pulses -->
  <circle r="3.5" fill="#7dd3fc">
    <animateMotion dur="3.6s" repeatCount="indefinite">
      <mpath href="#flow"/>
    </animateMotion>
  </circle>
  <circle r="3.5" fill="#4ade80">
    <animateMotion dur="3.6s" begin="1.8s" repeatCount="indefinite">
      <mpath href="#flow"/>
    </animateMotion>
  </circle>

  <text x="410" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b7284" text-anchor="middle">pH · TDS · turbidity · temperature  →  automated regulation  →  real-time cloud monitoring</text>
</svg>
