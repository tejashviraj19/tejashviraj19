<svg width="820" height="150" viewBox="0 0 820 150" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="nodeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="820" height="150" fill="#060a0f"/>
  <g stroke="#0e1720" stroke-width="1">
    <line x1="0" y1="20" x2="820" y2="20"/>
    <line x1="0" y1="130" x2="820" y2="130"/>
  </g>

  <g fill="none" stroke="#1f4a5c" stroke-width="1.5">
    <path id="flow" d="M 100 75 H 265 M 345 75 H 425 M 505 75 H 585 M 665 75 H 730"/>
  </g>
  <path d="M 100 75 H 265 M 345 75 H 425 M 505 75 H 585 M 665 75 H 730"
        fill="none" stroke="#38bdf8" stroke-width="1.3" stroke-dasharray="5 9" opacity="0.5">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.1s" repeatCount="indefinite"/>
  </path>

  <!-- nodes -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#dbeafe" text-anchor="middle">
    <g>
      <rect x="20" y="50" width="160" height="50" rx="7" fill="#0e1a24" stroke="#274a5c"/>
      <circle cx="168" cy="58" r="2.4" fill="#4ade80">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="100" y="80" font-weight="600">Sensors</text>
    </g>
    <g>
      <rect x="265" y="50" width="80" height="50" rx="7" fill="#0e1a24" stroke="#38bdf8" filter="url(#nodeGlow)"/>
      <circle cx="333" cy="58" r="2.4" fill="#7dd3fc">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="305" y="80" font-weight="600" fill="#7dd3fc">ESP32</text>
    </g>
    <g>
      <rect x="425" y="50" width="80" height="50" rx="7" fill="#0e1a24" stroke="#274a5c"/>
      <circle cx="493" cy="58" r="2.4" fill="#4ade80">
        <animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <text x="465" y="75">Control</text>
      <text x="465" y="89">Logic</text>
    </g>
    <g>
      <rect x="585" y="50" width="80" height="50" rx="7" fill="#0e1a24" stroke="#274a5c"/>
      <circle cx="653" cy="58" r="2.4" fill="#4ade80">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="625" y="80">Actuators</text>
    </g>
    <g>
      <rect x="730" y="45" width="70" height="60" rx="7" fill="#0e1a24" stroke="#4ade80" filter="url(#nodeGlow)"/>
      <circle cx="793" cy="53" r="2.4" fill="#86efac">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="765" y="72" fill="#86efac">Cloud</text>
      <text x="765" y="86" fill="#86efac">Dashboard</text>
    </g>
  </g>

  <!-- travelling pulses -->
  <circle r="3.5" fill="#7dd3fc" filter="url(#nodeGlow)">
    <animateMotion dur="3.6s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion>
  </circle>
  <circle r="3.5" fill="#4ade80" filter="url(#nodeGlow)">
    <animateMotion dur="3.6s" begin="1.8s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion>
  </circle>

  <text x="410" y="123" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b7284" text-anchor="middle">pH · TDS · turbidity · temperature  →  automated regulation  →  real-time cloud monitoring</text>

  <g stroke="#38bdf8" stroke-width="1.3" fill="none" opacity="0.5">
    <path d="M8,20 L8,8 L20,8"/>
    <path d="M812,20 L812,8 L800,8"/>
    <path d="M8,130 L8,142 L20,142"/>
    <path d="M812,130 L812,142 L800,142"/>
  </g>
</svg>
