<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04070a"/>
      <stop offset="1" stop-color="#0b141c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7dd3fc" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="900" height="230" fill="url(#bg)"/>

  <g stroke="#101c26" stroke-width="1">
    <line x1="0" y1="30" x2="900" y2="30"/>
    <line x1="0" y1="70" x2="900" y2="70"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="120" y1="0" x2="120" y2="230"/>
    <line x1="780" y1="0" x2="780" y2="230"/>
  </g>

  <!-- top data bus -->
  <line x1="0" y1="4" x2="900" y2="4" stroke="#16273350" stroke-width="1"/>
  <line x1="0" y1="4" x2="60" y2="4" stroke="#38bdf8" stroke-width="1.5" opacity="0.8">
    <animate attributeName="x1" values="0;840;0" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="60;900;60" dur="4.5s" repeatCount="indefinite"/>
  </line>

  <circle cx="700" cy="115" r="120" fill="url(#glow)"/>
  <circle cx="700" cy="115" r="90" fill="url(#bigGlow)" fill-opacity="0.08"/>

  <!-- rotating targeting ring -->
  <circle cx="700" cy="115" r="58" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.45" stroke-dasharray="4 10">
    <animateTransform attributeName="transform" type="rotate" from="0 700 115" to="360 700 115" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="115" r="70" fill="none" stroke="#4ade80" stroke-width="1" opacity="0.25" stroke-dasharray="2 14">
    <animateTransform attributeName="transform" type="rotate" from="360 700 115" to="0 700 115" dur="20s" repeatCount="indefinite"/>
  </circle>

  <!-- central chip -->
  <rect x="655" y="90" width="90" height="50" rx="6" fill="#0e1a24" stroke="#38bdf8" stroke-width="1.5" filter="url(#softGlow)"/>
  <circle cx="700" cy="115" r="2.5" fill="#7dd3fc">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- chip pins -->
  <g stroke="#1f4a5c" stroke-width="1.5">
    <line x1="655" y1="100" x2="640" y2="100"/>
    <line x1="655" y1="115" x2="640" y2="115"/>
    <line x1="655" y1="130" x2="640" y2="130"/>
    <line x1="745" y1="100" x2="760" y2="100"/>
    <line x1="745" y1="115" x2="760" y2="115"/>
    <line x1="745" y1="130" x2="760" y2="130"/>
    <line x1="675" y1="90" x2="675" y2="75"/>
    <line x1="700" y1="90" x2="700" y2="75"/>
    <line x1="725" y1="90" x2="725" y2="75"/>
    <line x1="675" y1="140" x2="675" y2="155"/>
    <line x1="700" y1="140" x2="700" y2="155"/>
    <line x1="725" y1="140" x2="725" y2="155"/>
  </g>

  <!-- traces feeding into the chip -->
  <g fill="none" stroke="#1f4a5c" stroke-width="1.5">
    <path id="t1" d="M 40 40 H 300 V 100 H 640"/>
    <path id="t2" d="M 40 90 H 400 V 115 H 640"/>
    <path id="t3" d="M 40 150 H 350 V 130 H 640"/>
    <path id="t4" d="M 800 40 H 700 V 75"/>
    <path id="t5" d="M 800 190 H 700 V 155"/>
  </g>

  <circle r="3" fill="#7dd3fc" filter="url(#softGlow)">
    <animateMotion dur="3.2s" repeatCount="indefinite" rotate="auto"><mpath href="#t1"/></animateMotion>
  </circle>
  <circle r="3" fill="#7dd3fc" filter="url(#softGlow)">
    <animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" rotate="auto"><mpath href="#t2"/></animateMotion>
  </circle>
  <circle r="3" fill="#7dd3fc" filter="url(#softGlow)">
    <animateMotion dur="2.8s" begin="1.1s" repeatCount="indefinite" rotate="auto"><mpath href="#t3"/></animateMotion>
  </circle>
  <circle r="2.5" fill="#4ade80" filter="url(#softGlow)">
    <animateMotion dur="2s" begin="0.3s" repeatCount="indefinite" rotate="auto"><mpath href="#t4"/></animateMotion>
  </circle>
  <circle r="2.5" fill="#4ade80" filter="url(#softGlow)">
    <animateMotion dur="2s" begin="1.3s" repeatCount="indefinite" rotate="auto"><mpath href="#t5"/></animateMotion>
  </circle>

  <!-- vias -->
  <g fill="#12202c" stroke="#274a5c" stroke-width="1">
    <circle cx="300" cy="40" r="3"/>
    <circle cx="400" cy="90" r="3"/>
    <circle cx="350" cy="150" r="3"/>
  </g>

  <!-- light sweep -->
  <rect x="-300" y="0" width="260" height="230" fill="url(#scan)" style="mix-blend-mode:screen">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="1250 0" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <!-- text -->
  <text x="40" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#e8f4fb">TEJASHVI RAJ</text>
  <text x="40" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#38bdf8" letter-spacing="0.5">ELECTRONICS &amp; EMBEDDED SYSTEMS ENGINEER</text>
  <text x="40" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#7c93a3">Building sensor-driven hardware, embedded systems &amp; connected products.</text>
  <text x="40" y="196" font-family="SFMono-Regular, Consolas, monospace" font-size="10.5" letter-spacing="1.2" fill="#3d5566">ESP32-S3 · KiCad · Industrial Controls</text>

  <!-- corner brackets -->
  <g stroke="#38bdf8" stroke-width="1.4" fill="none" opacity="0.55">
    <path d="M10,24 L10,10 L24,10"/>
    <path d="M890,24 L890,10 L876,10"/>
    <path d="M10,206 L10,220 L24,220"/>
    <path d="M890,206 L890,220 L876,220"/>
  </g>

  <rect width="900" height="230" fill="url(#vignette)"/>
</svg>
