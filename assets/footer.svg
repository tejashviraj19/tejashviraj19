<svg width="900" height="90" viewBox="0 0 900 90" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="waveGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <rect width="900" height="90" fill="#04070a"/>
  <line x1="0" y1="45" x2="900" y2="45" stroke="#101c26" stroke-width="1"/>

  <path id="wave1" stroke="#4ade80" stroke-width="1.1" fill="none" opacity="0.3" filter="url(#waveGlow)"
        d="M0 45 C 20 22, 40 22, 60 45 S 100 68, 120 45 S 160 22, 180 45 S 220 68, 240 45 S 280 22, 300 45 S 340 68, 360 45 S 400 22, 420 45 S 460 68, 480 45 S 520 22, 540 45 S 580 68, 600 45 S 640 22, 660 45 S 700 68, 720 45 S 760 22, 780 45 S 820 68, 840 45 S 880 22, 900 45"/>
  <path id="wave1b" stroke="#4ade80" stroke-width="1.1" fill="none" opacity="0.3" filter="url(#waveGlow)"
        d="M900 45 C 920 22, 940 22, 960 45 S 1000 68, 1020 45 S 1060 22, 1080 45 S 1120 68, 1140 45 S 1180 22, 1200 45 S 1240 68, 1260 45 S 1300 22, 1320 45 S 1360 68, 1380 45 S 1420 22, 1440 45 S 1480 68, 1500 45 S 1540 22, 1560 45 S 1600 68, 1620 45 S 1660 22, 1680 45 S 1720 68, 1740 45 S 1780 22, 1800 45"/>

  <path id="wave2" stroke="#38bdf8" stroke-width="1.4" fill="none" opacity="0.8" filter="url(#waveGlow)"
        d="M0 45 C 20 10, 40 10, 60 45 S 100 80, 120 45 S 160 10, 180 45 S 220 80, 240 45 S 280 10, 300 45 S 340 80, 360 45 S 400 10, 420 45 S 460 80, 480 45 S 520 10, 540 45 S 580 80, 600 45 S 640 10, 660 45 S 700 80, 720 45 S 760 10, 780 45 S 820 80, 840 45 S 880 10, 900 45"/>
  <path id="wave2b" stroke="#38bdf8" stroke-width="1.4" fill="none" opacity="0.8" filter="url(#waveGlow)"
        d="M900 45 C 920 10, 940 10, 960 45 S 1000 80, 1020 45 S 1060 10, 1080 45 S 1120 80, 1140 45 S 1180 10, 1200 45 S 1240 80, 1260 45 S 1300 10, 1320 45 S 1360 80, 1380 45 S 1420 10, 1440 45 S 1480 80, 1500 45 S 1540 10, 1560 45 S 1600 80, 1620 45 S 1660 10, 1680 45 S 1720 80, 1740 45 S 1780 10, 1800 45"/>

  <g>
    <animateTransform attributeName="transform" attributeType="XML" type="translate" from="0 0" to="-900 0" dur="7s" repeatCount="indefinite"/>
    <use href="#wave1"/><use href="#wave1b"/>
  </g>
  <g>
    <animateTransform attributeName="transform" attributeType="XML" type="translate" from="0 0" to="-900 0" dur="5s" repeatCount="indefinite"/>
    <use href="#wave2"/><use href="#wave2b"/>
  </g>

  <circle cx="420" cy="72" r="3" fill="#4ade80">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="432" y="76" font-family="SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="0.6" fill="#5b7284">SYSTEM NOMINAL</text>
  <text x="450" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b7284" text-anchor="middle">designed, wired &amp; debugged by Tejashvi Raj</text>

  <g stroke="#38bdf8" stroke-width="1.3" fill="none" opacity="0.5">
    <path d="M8,20 L8,8 L20,8"/>
    <path d="M892,20 L892,8 L880,8"/>
    <path d="M8,82 L8,72 L20,72" transform="translate(0,8)"/>
    <path d="M892,82 L892,72 L880,72" transform="translate(0,8)"/>
  </g>
</svg>
