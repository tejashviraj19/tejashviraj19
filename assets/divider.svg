<svg width="900" height="26" viewBox="0 0 900 26" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="dGlow" x="-60%" y="-200%" width="220%" height="500%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <line x1="0" y1="13" x2="900" y2="13" stroke="#101c26" stroke-width="1"/>
  <g stroke="#12202c" stroke-width="1" opacity="0.6">
    <line x1="0" y1="9" x2="0" y2="17"/>
    <line x1="150" y1="10" x2="150" y2="16"/>
    <line x1="300" y1="10" x2="300" y2="16"/>
    <line x1="600" y1="10" x2="600" y2="16"/>
    <line x1="750" y1="10" x2="750" y2="16"/>
    <line x1="900" y1="9" x2="900" y2="17"/>
  </g>

  <line x1="0" y1="13" x2="900" y2="13" stroke="#38bdf8" stroke-width="3"
        stroke-dasharray="8 24" stroke-linecap="round" opacity="0.35" filter="url(#dGlow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="1.4s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="13" x2="900" y2="13" stroke="#7dd3fc" stroke-width="1.4"
        stroke-dasharray="8 24" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="1.4s" repeatCount="indefinite"/>
  </line>

  <g fill="#0e1a24" stroke="#38bdf8" stroke-width="1.2">
    <circle cx="60" cy="13" r="3.5"/>
    <circle cx="450" cy="13" r="3.5"/>
    <circle cx="840" cy="13" r="3.5"/>
  </g>
</svg>
